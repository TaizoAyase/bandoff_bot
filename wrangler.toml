name = "studio-parts"
main = "src/index.ts"
compatibility_date = "2026-09-04"

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "studio-parts"
# 本番の D1 の ID。識別子であって認証情報ではない(アクセスにはアカウントの
# API トークンが必要)ため、リポジトリに含めてよい。
database_id = "85a1c700-2a0d-4ba4-b370-c28fca4e308e"
migrations_dir = "migrations"

# 暫定的にデバッグ用として有効化している(本来は無効が既定)。有効にすると
# invocation log にリクエスト URL がそのまま残るため、秘密である
# `/e/{slug}/` の slug が Cloudflare のログ基盤に永続化される。これは
# 仕様書「アクセスログに秘密 URL を平文で残さない」(docs/bandoff-spec.md
# 2.2)に反する状態。**調査が終わったら enabled = false に戻すこと。**
# ダッシュボードのログ画面には秘密 URL がそのまま表示されるため、共有画面や
# スクリーンショットへの映り込みに注意する。
# `wrangler tail` はこの設定と独立した別機能で、設定変更なしで使える。
[observability]
enabled = true
